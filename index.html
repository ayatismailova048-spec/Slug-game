<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slug — лаборатория слизня</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e4235">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slug">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<script>
/* если игра запущена из иконки — заставку не показываем вовсе,
   класс ставится до первой отрисовки, чтобы она не мелькала */
(function () {
  var app = false;
  try {
    if (window.matchMedia) {
      app = matchMedia('(display-mode: standalone)').matches
         || matchMedia('(display-mode: fullscreen)').matches
         || matchMedia('(display-mode: minimal-ui)').matches;
    }
    if (navigator.standalone === true) app = true;
    if (document.referrer.indexOf('android-app://') === 0) app = true;
  } catch (e) { /* не важно */ }
  if (app) document.documentElement.className += ' app-mode';
})();
</script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <button id="installBtn" class="hidden" type="button">
    <img src="icons/icon-192.png" alt=""><span>Установить</span>
  </button>

  <div id="namebox" class="hidden">
    <div class="name-card">
      <div class="name-title">Как его назвать?</div>
      <input id="nameInput" type="text" inputmode="text" enterkeyhint="done" maxlength="22" autocomplete="off" autocapitalize="sentences" placeholder="Слизень">
      <div class="name-btns">
        <button id="nameOk">Сохранить</button>
        <button id="nameCancel">Отмена</button>
      </div>
    </div>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <img class="boot-slug" src="icons/icon-192.png" alt="Slug">
      <h1>Slug</h1>
      <button id="bootBtn">Начать</button>
      <small>Нажми, чтобы включить звук</small>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/slug.js"></script>
  <script src="js/slugArt.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/save.js"></script>
  <script src="js/app.js"></script>
  <script src="js/room.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/stations/index.js"></script>
  <script src="js/stations/base.js"></script>
  <script src="js/stations/blender.js"></script>
  <script src="js/stations/campfire.js"></script>
  <script src="js/stations/acid.js"></script>
  <script src="js/stations/shower.js"></script>
  <script src="js/stations/pills.js"></script>
  <script src="js/stations/pan.js"></script>
  <script src="js/stations/ice.js"></script>
  <script src="js/screens/title.js"></script>
  <script src="js/screens/hub.js"></script>
  <script src="js/screens/saves.js"></script>
  <script src="js/screens/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
